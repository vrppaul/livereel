<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>livereel stage</title>
		<link rel="stylesheet" href="tokens.css" />
		<link rel="stylesheet" href="stage.css" />
		<script defer src="stage.js"></script>
	</head>
	<body>
		<!-- An exposure of the frame: all of it drawn as the camera stood at one moment, on the ground; the stage copies it for each further exposure it draws at once -->
		<div class="exposure" data-exposure>
			<!-- The screen, up out of the ground as far as it has come, with its window's shadow and edge: its root stands round the window, so the shadow beside the view reads how far it has come; the page's window, where the camera's picture shows: the whole frame or a window on the ground with its shadow under it; in it the camera moves the screen. The page sits in the screen's frame, the light and the cursor lie on it, and a callout stands beside it, past its edge where it reaches there -->
			<div data-prop="screen">
				<div data-prop="window">
					<div class="stage" data-prop="camera">
						<div class="view-shadow"></div>
						<div class="view">
							<div class="camera">
								<div class="screen">
									<iframe class="page" data-part="page" title="The page being filmed"></iframe>
									<img class="page" data-part="picture" alt="The page being filmed" hidden />
									<div class="light" data-prop="light"></div>
									<svg class="cursor" data-prop="cursor" viewBox="0 0 30 40" aria-hidden="true">
										<path d="M3 3 L3 31 L10.5 24 L16 36.5 L21 34.5 L15.5 22.5 L25.5 22.5 Z" />
									</svg>
								</div>
								<div class="callout" data-prop="callout">
									<div class="card"><div class="words" data-part="words"></div></div>
								</div>
								<div class="pins" data-prop="pins"></div>
							</div>
							<!-- The objects standing in the page's window, over its picture, leaning and travelling with it -->
							<div class="objects" data-scene="window"></div>
						</div>
					</div>
				</div>
			</div>
			<!-- What stands flat over the frame, whatever the camera does, under the objects: a note and its line -->
			<div class="over-the-frame">
				<div class="note" data-prop="note">
					<div class="line"></div>
					<div class="words note-words" data-part="words"></div>
				</div>
			</div>
			<!-- The objects on the frame, each made from its content's template below, in the scene's order, on the layer the scene gives it, one standing in another laid in that one's element; and those pushed off past the frame's edge while they go -->
			<div class="objects" data-scene="objects"></div>
			<div class="objects" data-scene="leaving"></div>
		</div>
		<!-- An object, by what it shows: a title's words, on a ground of their own over its box where they have one; a pane of code; the agent's terminal; the ending card; a caption on the ground that darkens the frame's edge under it, and a place over its words for the keys; the caps of a shortcut -->
		<template data-kind="words">
			<div class="object">
				<div class="content title" data-part="content">
					<div class="ground"></div>
					<div class="words" data-part="words"></div>
				</div>
			</div>
		</template>
		<template data-kind="code">
			<div class="object">
				<div class="content code" data-part="content">
					<div class="pane"><div class="lines" data-part="lines"></div></div>
				</div>
			</div>
		</template>
		<template data-kind="terminal">
			<div class="object">
				<div class="content terminal" data-part="content">
					<div class="window">
						<div class="bar"><i></i><i></i><i></i><span class="heading" data-part="title"></span></div>
						<div class="log" data-part="log"></div>
						<div class="line">
							<span class="prompt">&gt;</span><span class="typed" data-part="typed"></span
							><span class="caret" data-part="caret"></span>
						</div>
					</div>
				</div>
			</div>
		</template>
		<template data-kind="ending">
			<div class="object">
				<div class="content ending" data-part="content">
					<div class="name" data-part="name"></div>
					<div class="what" data-part="what"></div>
					<div class="command"><span class="prompt">&gt;</span><span data-part="command"></span></div>
				</div>
			</div>
		</template>
		<template data-kind="caption">
			<div class="object">
				<div class="content caption" data-part="content">
					<div class="ground"></div>
					<div class="foot">
						<div class="over-the-words" data-part="over-the-words"></div>
						<div class="words" data-part="words"></div>
					</div>
				</div>
			</div>
		</template>
		<template data-kind="keys">
			<div class="object">
				<div class="content keys" data-part="content">
					<div class="caps" data-part="caps"></div>
				</div>
			</div>
		</template>
	</body>
</html>
