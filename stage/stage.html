<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>livereel stage</title>
		<link rel="stylesheet" href="tokens.css" />
		<link rel="stylesheet" href="stage.css" />
		<script defer src="stage.js"></script>
	</head>
	<body>
		<!-- An exposure of the frame: all of it drawn as the camera stood at one moment, on the ground; the stage copies it for each further exposure it draws at once. It stands in three surfaces, one over the other, which a film drawn as a room lays in its canvas apart: the ground, the window and all in it, and what stands on the frame -->
		<div class="exposure" data-exposure>
			<!-- The ground, and the layers the film lays over it, under all else -->
			<div class="surface" data-surface="ground"><div class="layers"></div></div>
			<!-- The screen, up out of the ground as far as it has come, with its window's shadow and edge: its root stands round the window, so the shadow beside the view reads how far it has come; the page's window, where the camera's picture shows: the whole frame or a window on the ground with its shadow under it; in it the camera moves the screen, which the window shades. The page sits in the screen's frame, the light and the cursor lie on it, and a callout stands beside it, past its edge where it reaches there -->
			<div class="surface" data-surface="window">
				<div data-prop="screen">
					<div class="window" data-prop="window">
						<div class="stage" data-prop="camera">
							<!-- The window's shadow and its view, as sharp as the eye sees them: the part the eye's focus blurs, round the view's cut, so a window out of focus spreads past its edge -->
							<div class="sharpness">
								<div class="view-shadow"></div>
								<div class="view">
									<div class="camera">
										<div class="screen">
											<iframe class="page" data-part="page" title="The page being filmed"></iframe>
											<img class="page" data-part="picture" alt="The page being filmed" hidden />
											<!-- The picture the screen showed as light began to sweep it away, over the page and cut where the light has still to sweep, and the light over it, a band or a disc's ring, as the sweep's shape has it, all cut at the screen's edge -->
											<div class="sweep" data-part="sweep" hidden>
												<div class="swept" data-part="swept"></div>
												<div class="band"></div>
												<div class="ring"></div>
											</div>
											<!-- The holes pieces of the page leave where they were lifted, on the page, under the light -->
											<div class="holes" data-scene="holes"></div>
											<div class="light" data-prop="light"></div>
											<svg class="cursor" data-prop="cursor" viewBox="0 0 30 40" aria-hidden="true">
												<path d="M3 3 L3 31 L10.5 24 L16 36.5 L21 34.5 L15.5 22.5 L25.5 22.5 Z" />
											</svg>
										</div>
										<div class="callout" data-prop="callout">
											<div class="card"><div class="words" data-part="words"></div></div>
										</div>
										<div class="pins" data-prop="pins"></div>
									</div>
									<!-- The objects standing in the page's window, over its picture, leaning and travelling with it -->
									<div class="objects" data-scene="window"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="surface" data-surface="frame">
				<!-- What stands flat over the frame, whatever the camera does, under the objects: the lines from pieces of the page to their sources, and a note and its line -->
				<div class="over-the-frame">
					<div class="piece-lines" data-scene="lines"></div>
					<div class="note" data-prop="note">
						<div class="segment" data-part="line"></div>
						<div class="words note-words" data-part="words"></div>
					</div>
				</div>
				<!-- The objects on the frame, each made from its content's template below, in the scene's order; and those pushed off past the frame's edge while they go -->
				<div class="objects" data-scene="objects"></div>
				<div class="objects" data-scene="leaving"></div>
				<!-- Over every object, a caption on the ground that darkens the frame's edge under it, its words, and over them a place keys stand in, as tall as the words; and keys, the caps of a shortcut, over the caption, laid in its place over its words while it stands at the frame's foot. Their figure, what a way of livereel's brings, stands in the part the way is drawn on, `way` -->
				<div class="caption" data-prop="caption">
					<div class="ground"></div>
					<div class="foot">
						<div class="way" data-part="way"><div class="words" data-part="words"></div></div>
						<div class="over-the-words" data-part="over-the-words"></div>
					</div>
				</div>
				<div class="keys" data-prop="keys">
					<div class="way" data-part="way"><div class="caps" data-part="caps"></div></div>
				</div>
			</div>
		</div>
		<!-- A surface an object of markup standing in the world is laid in apart from the frame's objects, where a frame is drawn as a room, which lays the surface in its canvas and stands it in its one scene: the object in a holder of the frame's size, so it stands where the frame has it -->
		<template data-apart>
			<div class="surface" data-surface="world"><div class="objects" data-part="objects"></div></div>
		</template>
		<!-- An object, by what it shows: a title's words, on a ground of their own over its box where they have one; a pane of code; the agent's terminal; the ending card, its lines on the frame's ground. Its figure, what a way of livereel's brings, stands in the part the way is drawn on, `way` -->
		<template data-kind="title">
			<div class="object">
				<div class="content title" data-part="content">
					<div class="ground"><div class="layers"></div></div>
					<div class="way" data-part="way"><div class="words" data-part="words"></div></div>
				</div>
			</div>
		</template>
		<template data-kind="code">
			<div class="object">
				<div class="content code" data-part="content">
					<div class="way" data-part="way">
						<div class="pane">
							<div class="lines-shown"><div class="lines" data-part="lines"></div></div>
						</div>
					</div>
				</div>
			</div>
		</template>
		<template data-kind="terminal">
			<div class="object">
				<div class="content terminal" data-part="content">
					<div class="way" data-part="way">
						<div class="pane">
							<div class="bar"><i></i><i></i><i></i><span class="heading" data-part="title"></span></div>
							<div class="log" data-part="log"></div>
							<div class="line">
								<span class="prompt">&gt;</span><span class="typed" data-part="typed"></span
								><span class="caret" data-part="caret"></span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</template>
		<template data-kind="ending">
			<div class="object">
				<div class="content ending" data-part="content">
					<div class="ground"><div class="layers"></div></div>
					<div class="way" data-part="way">
						<div class="says">
							<div class="name" data-part="name"></div>
							<div class="what" data-part="what"></div>
							<div class="command"><span class="prompt">&gt;</span><span data-part="command"></span></div>
						</div>
					</div>
				</div>
			</div>
		</template>
		<!-- A piece of the page: its figure the part of the page's picture over its source, with the holes other pieces leave there laid in it -->
		<template data-kind="piece">
			<div class="object">
				<div class="content piece" data-part="content">
					<div class="way" data-part="way"></div>
				</div>
			</div>
		</template>
		<!-- An outline: its figure a ring a little clear of its box -->
		<template data-kind="outline">
			<div class="object">
				<div class="content outline" data-part="content">
					<div class="way" data-part="way"></div>
				</div>
			</div>
		</template>
		<!-- A lens: its figure a round glass showing the part of the page's picture under its middle, with the holes pieces leave there laid in it -->
		<template data-kind="lens">
			<div class="object">
				<div class="content lens" data-part="content">
					<div class="way" data-part="way"></div>
				</div>
			</div>
		</template>
		<!-- A thing: nothing of the stage's markup, its box kept for its place; the room draws it from the film's own three.js -->
		<template data-kind="thing">
			<div class="object">
				<div class="content thing" data-part="content">
					<div class="way" data-part="way"></div>
				</div>
			</div>
		</template>
	</body>
</html>
