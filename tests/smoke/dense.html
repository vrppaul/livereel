<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>A page dense with code</title>
		<style>
			pre {
				margin: 0;
				font: 13px/16px monospace;
			}
		</style>
	</head>
	<body>
		<pre data-testid="lines"></pre>
		<script>
			// Lines of letters as dense as code, each the letters shifted on by one more: its picture, taken as sharp as
			// livereel's closest camera needs it, is too large to stand in a custom property as a data URL (6,950,132
			// characters of base64 at 1920 × 1080, past the 2,097,152 Chrome keeps)
			const LINES = 70;
			const LETTERS_A_LINE = 240;
			const LETTERS = 'abcdefghijklmnopqrstuvwxyz0123456789{}();=+-*/<>ABCDEFGHIJKLMNOPQRSTUVWXYZ';
			const REPEATED = LETTERS.repeat(Math.ceil((LINES + LETTERS_A_LINE) / LETTERS.length));
			const lines = [...Array(LINES).keys()].map((line) => REPEATED.slice(line, line + LETTERS_A_LINE));
			document.querySelector('[data-testid=lines]').textContent = lines.join('\n');
		</script>
	</body>
</html>
