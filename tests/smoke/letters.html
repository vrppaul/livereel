<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Letters</title>
		<style>
			body {
				margin: 0;
				font: 20px/30px monospace;
			}
			p {
				margin: 0;
				padding: 10px 0 0 30px;
			}
		</style>
	</head>
	<body>
		<main>
			<p data-testid="code"><span data-testid="word" style="font-size: 30px">abcdef</span> ghij</p>
			<p data-testid="blank"></p>
			<p data-testid="filled">abc</p>
			<p data-testid="hidden" hidden>abc</p>
		</main>
	</body>
</html>
