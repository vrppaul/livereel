# Every hook runs once, before the commit; only the message check runs on the message
default_stages: [pre-commit]

repos:
  # The project's own tools, the ones pnpm and CI run, at the versions the lockfile pins
  - repo: local
    hooks:
      - id: prettier
        name: prettier (formatting)
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint (the layers, the code rules, a film's numbers)
        entry: pnpm exec eslint .
        language: system
        pass_filenames: false
        always_run: true
      - id: stylelint
        name: "stylelint (the stage's styles: tokens only, nothing moving of itself)"
        entry: pnpm exec stylelint
        language: system
        files: ^stage/.*\.css$
      - id: tsc
        name: tsc (the type checker)
        entry: pnpm exec tsc --noEmit -p .
        language: system
        pass_filenames: false
        always_run: true
      - id: knip
        name: knip (code and dependencies nothing uses)
        entry: pnpm exec knip
        language: system
        pass_filenames: false
        always_run: true
      - id: film-documents
        name: the skill and the README (each names every function a film can call)
        entry: node -C source scripts/check-film-documents.ts
        language: system
        pass_filenames: false
        always_run: true
      # The whole suite takes seconds, a film in a browser and the command line included; listing the tests alone
      # loads no module, so a test that cannot run would pass
      - id: tests
        name: vitest (the tests)
        entry: pnpm exec vitest run
        language: system
        pass_filenames: false
        always_run: true

  # The spelling of everything but the tests, which are held to formatting alone (.claude/rules/tests.md)
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        exclude: ^(tests/|pnpm-lock\.yaml$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        # A tsconfig is JSON with comments, as TypeScript reads it
        exclude: ^tsconfig(\.build)?\.json$
      - id: check-case-conflict
      - id: check-symlinks

  # claude-review's gate of its instruction files, taken as it is (scripts/check_instruction_files.py), run in an
  # environment pre-commit makes for it
  - repo: local
    hooks:
      - id: instruction-files
        name: instruction files (their size, the paths they name, how they are reached)
        entry: python scripts/check_instruction_files.py
        language: python
        language_version: python3.14
        additional_dependencies: [pydantic]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore]
