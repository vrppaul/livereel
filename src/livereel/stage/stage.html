<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>livereel stage</title>
		<link rel="stylesheet" href="stage.css" />
	</head>
	<body>
		<!-- The screen the camera moves, the page in its frame; the light and the cursor lie on it and move with it -->
		<div id="stage">
			<div id="screen">
				<iframe id="page" title="The page being filmed"></iframe>
				<div id="light"></div>
				<svg id="cursor" viewBox="0 0 30 40" aria-hidden="true">
					<path d="M3 3 L3 31 L10.5 24 L16 36.5 L21 34.5 L15.5 22.5 L25.5 22.5 Z" />
				</svg>
			</div>
		</div>
		<!-- What stands flat over the frame, whatever the camera does: the caption, the terminal, the ending -->
		<div id="caption-ground"></div>
		<div id="caption"></div>
		<div id="terminal">
			<div class="window">
				<div class="bar"><i></i><i></i><i></i><span class="title"></span></div>
				<div class="log"></div>
				<div class="line"><span class="prompt">&gt;</span><span class="typed"></span><span class="caret"></span></div>
			</div>
		</div>
		<div id="ending">
			<div class="name"></div>
			<div class="what"></div>
			<div class="command"><span class="prompt">&gt;</span><span class="typed"></span></div>
		</div>
		<script src="stage.js"></script>
	</body>
</html>
