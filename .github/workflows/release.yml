# A tag `vX.Y.Z` pushed: the package published to npm and a release made on GitHub. The tag's version is the one in
# package.json (CONTRIBUTING.md, Releasing). npm trusts this workflow itself (Trusted Publishing, set on the
# package's page on npm): it is given a short-lived identity, so no token is kept, and the package carries its
# provenance
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the version being published
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # npm itself publishes: it speaks Trusted Publishing; `prepack` builds the package first
      - run: npm publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
